[package]
name = "mbse-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
mbse-model = { path = "../mbse-model" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "accesskit"] }
craft-ui = { path = "../../vendor/craft-libs/crates/ui", features = ["serde"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

craft-settings = { path = "../../vendor/craft-libs/crates/settings" }
craft-quit = { path = "../../vendor/craft-libs/crates/quit", features = ["egui"] }
craft-docpath = { path = "../../vendor/craft-libs/crates/docpath" }
serde = { version = "1", features = ["derive"] }
craft-window = { path = "../../vendor/craft-libs/crates/window", features = ["egui"] }
mbse-catalog = { path = "../mbse-catalog" }
mbse-exchange = { path = "../mbse-exchange" }
mbse-assurance = { path = "../mbse-assurance" }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[dependencies.craft-platform]
path = "../../vendor/craft-libs/crates/platform"
